<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>📊 互动课堂 - 教师数据看板</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          morandi: {
            bg: '#f5f0eb',
            card: '#ffffff',
            primary: '#8d8b82',
            accent: '#c4a882',
            ink: '#4a4845',
          }
        }
      }
    }
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d8d0c6; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .sortable { user-select: none; }
  .sortable:hover { color: #5f5d57; }
  .modal-fade { animation: fadeIn .18s ease-out; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body class="bg-[#f5f0eb] text-[#4a4845] min-h-screen">

<!-- 顶部导航栏 -->
<header class="sticky top-0 z-40 backdrop-blur bg-[#f5f0eb]/90 border-b border-[#e2dbd2]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-3 flex-wrap">
    <h1 class="text-lg sm:text-2xl font-bold text-[#5f5d57] tracking-wide">📊 互动课堂 - 教师数据看板</h1>
    <div class="flex items-center gap-3">
      <button id="adminToggleBtn" onclick="toggleAdminPanel()"
              class="inline-flex items-center gap-1.5 bg-white border border-[#e2dbd2] hover:border-[#c4a882] active:scale-95 transition text-[#6b6760] text-sm px-3.5 py-2 rounded-xl shadow-sm">
        <span>名单管理</span>
      </button>
      <span id="lastUpdated" class="text-xs sm:text-sm text-[#8d8b82]">最后更新：--</span>
      <button id="refreshBtn" onclick="loadAllData(true)"
              class="inline-flex items-center gap-1.5 bg-[#8d8b82] hover:bg-[#7c7a71] active:scale-95 transition text-white text-sm px-3.5 py-2 rounded-xl shadow-sm disabled:opacity-60 disabled:cursor-not-allowed">
        <span id="refreshIcon" class="inline-block w-4 h-4 leading-none">🔄</span>
        <span>刷新</span>
      </button>
    </div>
  </div>
</header>

<!-- 错误提示条 -->
<div id="errorBanner" class="hidden max-w-7xl mx-auto mt-4 px-4 sm:px-6">
  <div class="flex items-start gap-3 bg-[#f6e3e0] border border-[#e2c0bb] text-[#a05f5f] rounded-2xl px-4 py-3 text-sm shadow-sm">
    <span>⚠️</span>
    <p id="errorText" class="flex-1 leading-relaxed"></p>
    <button onclick="hideError()" class="text-[#a05f5f] hover:text-[#8c4f4f] font-bold px-1" title="关闭">✕</button>
  </div>
</div>

<!-- 名单管理（教师端） -->
<section id="adminPanel" class="hidden max-w-7xl mx-auto px-4 sm:px-6 mt-4">
  <div class="bg-white rounded-2xl shadow-sm border border-[#e8e1d9] p-5 space-y-3">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <h2 class="text-base sm:text-lg font-bold text-[#5f5d57]">学生名单管理</h2>
      <span id="adminHint" class="text-sm text-[#8d8b82]"></span>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <label for="adminKeyInput" class="text-sm text-[#8d8b82]">管理口令</label>
      <input id="adminKeyInput" type="password" placeholder="管理口令" autocomplete="off"
             class="w-40 bg-[#f7f3ee] border border-[#e2dbd2] rounded-xl px-3 py-2 text-sm text-[#4a4845] placeholder-[#b5aca1] focus:outline-none focus:ring-2 focus:ring-[#c4a882]/50 focus:border-[#c4a882] transition" />
      <button id="uploadRosterBtn"
              class="bg-[#8d8b82] hover:bg-[#7c7a71] active:scale-95 transition text-white text-sm px-3.5 py-2 rounded-xl shadow-sm">上传名单</button>
      <button id="viewRosterBtn"
              class="bg-white border border-[#e2dbd2] hover:border-[#c4a882] active:scale-95 transition text-[#6b6760] text-sm px-3.5 py-2 rounded-xl shadow-sm">查看当前名单</button>
    </div>
    <textarea id="rosterText" rows="4"
              placeholder="每行一个学生姓名，例如：&#10;张三&#10;李四&#10;王五&#10;（支持逗号、顿号、空格分隔）"
              class="w-full bg-[#f7f3ee] border border-[#e2dbd2] rounded-xl px-3 py-2 text-sm text-[#4a4845] placeholder-[#b5aca1] focus:outline-none focus:ring-2 focus:ring-[#c4a882]/50 focus:border-[#c4a882] transition"></textarea>
    <div id="adminResult" class="hidden text-sm text-[#6b6760] whitespace-pre-line bg-[#f7f3ee] border border-[#e2dbd2] rounded-xl px-4 py-3"></div>
  </div>
</section>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">

  <!-- 数据概览卡片 -->
  <section id="overviewCards" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 sm:gap-5" aria-label="数据概览">
    <div class="bg-white rounded-2xl shadow-sm border border-[#e8e1d9] p-5 flex items-start gap-4">
      <div class="w-11 h-11 rounded-xl bg-[#f3eee7] flex items-center justify-center text-xl shrink-0">👥</div>
      <div class="min-w-0">
        <p class="text-sm text-[#8d8b82]">总答题人数</p>
        <p id="cardTotalStudents" class="text-3xl font-bold text-[#4a4845] mt-1">--</p>
        <p class="text-xs text-[#b5aca1] mt-1">参与作答的学生数</p>
      </div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-[#e8e1d9] p-5 flex items-start gap-4">
      <div class="w-11 h-11 rounded-xl bg-[#f3eee7] flex items-center justify-center text-xl shrink-0">📝</div>
      <div class="min-w-0">
        <p class="text-sm text-[#8d8b82]">总答题次数</p>
        <p id="cardTotalAnswers" class="text-3xl font-bold text-[#4a4845] mt-1">--</p>
        <p class="text-xs text-[#b5aca1] mt-1">全部答题记录数</p>
      </div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-[#e8e1d9] p-5 flex items-start gap-4">
      <div class="w-11 h-11 rounded-xl bg-[#f3eee7] flex items-center justify-center text-xl shrink-0">✅</div>
      <div class="min-w-0">
        <p class="text-sm text-[#8d8b82]">整体正确率</p>
        <p class="mt-1 leading-none"><span id="cardAccuracy" class="text-4xl font-bold text-[#c4a882]">--</span><span class="text-lg font-semibold text-[#c4a882]">%</span></p>
        <p class="text-xs text-[#b5aca1] mt-2">答对次数 ÷ 总答题次数</p>
      </div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-[#e8e1d9] p-5 flex items-start gap-4">
      <div class="w-11 h-11 rounded-xl bg-[#f3eee7] flex items-center justify-center text-xl shrink-0">📅</div>
      <div class="min-w-0">
        <p class="text-sm text-[#8d8b82]">今日答题数</p>
        <p id="cardTodayAnswers" class="text-3xl font-bold text-[#4a4845] mt-1">--</p>
        <p class="text-xs text-[#b5aca1] mt-1">今天的新增答题记录</p>
      </div>
    </div>
  </section>

  <!-- 图表区：错题排行 + 正确率分布 -->
  <section class="grid grid-cols-1 lg:grid-cols-5 gap-4 sm:gap-5">
    <!-- 错题排行榜（60%） -->
    <div class="lg:col-span-3 bg-white rounded-2xl shadow-sm border border-[#e8e1d9] p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base sm:text-lg font-bold text-[#5f5d57]">📈 错题排行榜（TOP 10）</h2>
        <span class="text-xs text-[#b5aca1]">按错误次数排序</span>
      </div>
      <div class="relative h-[340px] sm:h-[400px]">
        <canvas id="wrongChart"></canvas>
        <div id="wrongChartEmpty" class="hidden absolute inset-0 flex flex-col items-center justify-center gap-2 text-[#b5aca1]">
          <span class="text-3xl">🍃</span>
          <p id="wrongChartEmptyText">暂无答题数据</p>
        </div>
      </div>
    </div>

    <!-- 答题正确率分布（40%） -->
    <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-[#e8e1d9] p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base sm:text-lg font-bold text-[#5f5d57]">🎯 答题正确率分布</h2>
        <span class="text-xs text-[#b5aca1]">按第几次答对统计</span>
      </div>
      <div class="relative h-[240px]">
        <canvas id="distChart"></canvas>
        <div class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center">
          <span id="distCenterNum" class="text-3xl font-bold text-[#5f5d57]">--</span>
          <span class="text-xs text-[#8d8b82] mt-0.5">次答对</span>
        </div>
        <div id="distChartEmpty" class="hidden absolute inset-0 bg-white/80 flex flex-col items-center justify-center gap-2 text-[#b5aca1]">
          <span class="text-3xl">📭</span>
          <p id="distChartEmptyText">暂无答题数据</p>
        </div>
      </div>
      <div id="distLegend" class="mt-4 space-y-2"></div>
    </div>
  </section>

  <!-- 学生答题详情表格 -->
  <section class="bg-white rounded-2xl shadow-sm border border-[#e8e1d9]">
    <div class="flex flex-wrap items-center justify-between gap-3 p-5 border-b border-[#f0eae2]">
      <h2 class="text-base sm:text-lg font-bold text-[#5f5d57]">👨‍🎓 学生答题详情</h2>
      <div class="flex items-center gap-3">
        <span id="studentCount" class="text-xs text-[#8d8b82]">共 0 人</span>
        <div class="relative">
          <input id="searchInput" type="search" placeholder="搜索学生姓名…"
                 oninput="onSearch(this.value)"
                 class="w-48 sm:w-64 bg-[#f7f3ee] border border-[#e2dbd2] rounded-xl pl-9 pr-3 py-2 text-sm text-[#4a4845] placeholder-[#b5aca1] focus:outline-none focus:ring-2 focus:ring-[#c4a882]/50 focus:border-[#c4a882] transition">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#b5aca1] text-sm">🔍</span>
        </div>
      </div>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm min-w-[760px]">
        <thead class="bg-[#f7f3ee] text-[#8d8b82] text-left">
          <tr>
            <th class="px-5 py-3 font-medium">学生姓名</th>
            <th data-sort="total_answers" onclick="handleSortClick('total_answers')" class="sortable px-5 py-3 font-medium cursor-pointer whitespace-nowrap">总答题数 <span class="sort-arrow text-xs">⇅</span></th>
            <th data-sort="correct_count" onclick="handleSortClick('correct_count')" class="sortable px-5 py-3 font-medium cursor-pointer whitespace-nowrap">正确数 <span class="sort-arrow text-xs">⇅</span></th>
            <th data-sort="accuracy" onclick="handleSortClick('accuracy')" class="sortable px-5 py-3 font-medium cursor-pointer whitespace-nowrap">正确率 <span class="sort-arrow text-xs">⇅</span></th>
            <th class="px-5 py-3 font-medium text-right">操作</th>
          </tr>
        </thead>
        <tbody id="studentTbody" class="divide-y divide-[#f0eae2]"></tbody>
      </table>
      <div id="tableEmpty" class="hidden py-12 text-center text-[#b5aca1]">
        <p id="tableEmptyText" class="text-sm">暂无学生答题数据</p>
      </div>
    </div>
  </section>
</main>

<!-- 学生答题详情模态框 -->
<div id="detailModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/40" onclick="closeModal()"></div>
  <div class="relative bg-white rounded-2xl w-full max-w-3xl max-h-[85vh] flex flex-col shadow-2xl modal-fade">
    <div class="flex items-center justify-between px-5 py-4 border-b border-[#f0eae2] shrink-0">
      <h3 id="modalTitle" class="text-base sm:text-lg font-bold text-[#5f5d57]">答题详情</h3>
      <button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-[#f0eae2] text-[#8d8b82] font-bold transition" title="关闭">✕</button>
    </div>
    <div id="modalBody" class="overflow-y-auto p-5"></div>
  </div>
</div>

<!-- 首次加载遮罩 -->
<div id="pageLoading" class="fixed inset-0 z-[60] bg-[#f5f0eb]/85 flex flex-col items-center justify-center gap-3">
  <div class="w-11 h-11 border-4 border-[#c4a882] border-t-transparent rounded-full animate-spin"></div>
  <p class="text-sm text-[#8d8b82]">正在加载看板数据…</p>
</div>

<script>
/* ============================================================
 * 互动课堂 - 教师数据看板
 * 数据源：后端 FastAPI（同源 API，页面由 /teacher 托管）
 * ============================================================ */

const API_BASE = window.location.origin;
const REFRESH_MS = 30 * 1000;   // 30 秒自动刷新

const MORANDI_RED = [
  "#b98b8b", "#c49a9a", "#cfa7a6", "#bd9394", "#d0adae",
  "#b3888a", "#d6b3b2", "#a97f80", "#d9bab8", "#b6908d",
];

const state = {
  students: [],
  search: "",
  sortKey: "accuracy",
  sortDir: "desc",
  loading: false,
  charts: { wrong: null, dist: null },
};

/* ---------- 工具函数 ---------- */

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function short(v, n) {
  const s = String(v ?? "");
  return s.length > n ? s.slice(0, n) + "…" : s;
}

function friendlyMessage(err) {
  const m = (err && err.message) ? err.message : "未知错误";
  if (/Failed to fetch|NetworkError|Load failed|Network request failed/i.test(m)) {
    return "无法连接服务器，请确认后端服务（" + API_BASE + "）已启动";
  }
  return m;
}

async function fetchJSON(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 8000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) {
      let detail = "";
      try { const d = await res.json(); detail = d.detail || ""; } catch (_) { /* ignore */ }
      throw new Error("HTTP " + res.status + (detail ? "：" + detail : ""));
    }
    return await res.json();
  } catch (err) {
    if (err.name === "AbortError") throw new Error("请求超时");
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

function setLastUpdated() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  document.getElementById("lastUpdated").textContent =
    "最后更新：" + d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
    " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

function setRefreshing(on) {
  const icon = document.getElementById("refreshIcon");
  const btn = document.getElementById("refreshBtn");
  icon.classList.toggle("animate-spin", on);
  btn.disabled = on;
}

function showError(msg) {
  const banner = document.getElementById("errorBanner");
  document.getElementById("errorText").textContent = "数据加载失败：" + msg + "，请检查后点击「刷新」重试。";
  banner.classList.remove("hidden");
}

function hideError() {
  document.getElementById("errorBanner").classList.add("hidden");
}

function destroyChart(key) {
  if (state.charts[key]) { state.charts[key].destroy(); state.charts[key] = null; }
}

/* ---------- 数据加载 ---------- */

async function loadAllData(manual = false) {
  if (state.loading) return;
  state.loading = true;
  setRefreshing(true);
  hideError();

  try {
    const [overview, questions, students] = await Promise.allSettled([
      fetchJSON(API_BASE + "/api/stats/overview"),
      fetchJSON(API_BASE + "/api/stats/questions"),
      fetchJSON(API_BASE + "/api/stats/students"),
    ]);

    let failed = null;

    if (overview.status === "fulfilled") {
      renderOverview(overview.value);
    } else {
      failed = failed || overview.reason;
      renderOverviewFallback();
    }

    if (questions.status === "fulfilled") {
      renderWrongChart(questions.value);
    } else {
      failed = failed || questions.reason;
      renderWrongChartFallback();
    }

    if (students.status === "fulfilled") {
      state.students = Array.isArray(students.value) ? students.value : [];
      renderTable();
      renderDistChart(state.students);
    } else {
      failed = failed || students.reason;
      state.students = [];
      renderTableFallback();
      renderDistChartFallback();
    }

    if (failed) showError(friendlyMessage(failed));
    setLastUpdated();
  } finally {
    state.loading = false;
    setRefreshing(false);
    document.getElementById("pageLoading").classList.add("hidden");
  }
}

/* ---------- 概览卡片 ---------- */

function renderOverview(data) {
  const fmt = n => Number(n || 0).toLocaleString("zh-CN");
  document.getElementById("cardTotalStudents").textContent = fmt(data.total_students);
  document.getElementById("cardTotalAnswers").textContent = fmt(data.total_answers);
  document.getElementById("cardAccuracy").textContent = Number(data.overall_accuracy || 0).toFixed(1);
  document.getElementById("cardTodayAnswers").textContent = fmt(data.today_answers);
}

function renderOverviewFallback() {
  ["cardTotalStudents", "cardTotalAnswers", "cardAccuracy", "cardTodayAnswers"].forEach(id => {
    document.getElementById(id).textContent = "--";
  });
}

/* ---------- 错题排行榜（横向柱状图） ---------- */

function renderWrongChart(list) {
  const canvas = document.getElementById("wrongChart");
  const empty = document.getElementById("wrongChartEmpty");
  const emptyText = document.getElementById("wrongChartEmptyText");
  const data = (Array.isArray(list) ? list : []).filter(q => q.error_count > 0).slice(0, 10);

  if (!data.length) {
    destroyChart("wrong");
    emptyText.textContent = Array.isArray(list) && list.length ? "暂无错题，全部题目均已答对 🎉" : "暂无答题数据";
    empty.classList.remove("hidden");
    return;
  }
  empty.classList.add("hidden");

  if (typeof Chart === "undefined") {
    destroyChart("wrong");
    emptyText.textContent = "图表组件加载失败，请检查网络连接后刷新";
    empty.classList.remove("hidden");
    return;
  }

  const labels = data.map(q => {
    const t = q.question_title || "未命名题目";
    return "#" + q.question_index + " " + short(t, 11);
  });
  const colors = data.map((_, i) => MORANDI_RED[i % MORANDI_RED.length]);

  destroyChart("wrong");
  state.charts.wrong = new Chart(canvas, {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        label: "错误次数",
        data: data.map(q => q.error_count),
        backgroundColor: colors,
        borderRadius: 6,
        barThickness: 22,
        maxBarThickness: 26,
      }],
    },
    options: {
      indexAxis: "y",
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "rgba(74,72,69,0.92)",
          padding: 10,
          titleFont: { size: 12 },
          bodyFont: { size: 12 },
          callbacks: {
            title: items => {
              const q = data[items[0].dataIndex];
              return (q.question_title || "未命名题目") + "（第 " + q.question_index + " 题）";
            },
            label: ctx => "错误次数：" + ctx.parsed.x + " 次",
            afterLabel: ctx => {
              const q = data[ctx.dataIndex];
              return "答题 " + q.answer_count + " 次 · 正确率 " + Number(q.accuracy || 0).toFixed(1) + "%";
            },
          },
        },
      },
      scales: {
        x: {
          beginAtZero: true,
          ticks: { precision: 0, color: "#8d8b82" },
          grid: { color: "#ece6de" },
        },
        y: {
          ticks: { color: "#6b6760", font: { size: 12 } },
          grid: { display: false },
        },
      },
    },
  });
}

function renderWrongChartFallback() {
  destroyChart("wrong");
  document.getElementById("wrongChartEmptyText").textContent = "加载失败，请点击「刷新」重试";
  document.getElementById("wrongChartEmpty").classList.remove("hidden");
}

/* ---------- 答题正确率分布（环形图） ---------- */

function computeDistribution(students) {
  const dist = { first: 0, second: 0, thirdPlus: 0 };
  for (const s of students || []) {
    const d = s.attempt_distribution || {};
    dist.first += Number(d.first_attempt || 0);
    dist.second += Number(d.second_attempt || 0);
    for (const [k, v] of Object.entries(d)) {
      if (k !== "first_attempt" && k !== "second_attempt") dist.thirdPlus += Number(v || 0);
    }
  }
  return dist;
}

function renderDistChart(students) {
  const canvas = document.getElementById("distChart");
  const empty = document.getElementById("distChartEmpty");
  const emptyText = document.getElementById("distChartEmptyText");
  const dist = computeDistribution(students);
  const total = dist.first + dist.second + dist.thirdPlus;
  document.getElementById("distCenterNum").textContent = total ? total.toLocaleString("zh-CN") : "--";

  const legendRows = [
    { label: "一次答对", val: dist.first, color: "#a8b5a0" },
    { label: "两次答对", val: dist.second, color: "#c4a882" },
    { label: "三次及以上答对", val: dist.thirdPlus, color: "#b98b8b" },
  ];
  document.getElementById("distLegend").innerHTML = legendRows.map(r => {
    const pct = total ? (r.val / total * 100).toFixed(1) : "0.0";
    return (
      '<div class="flex items-center justify-between gap-3 text-sm">' +
      '<span class="flex items-center gap-2 text-[#6b6760] min-w-0">' +
      '<span class="w-3 h-3 rounded-full shrink-0" style="background:' + r.color + '"></span>' +
      '<span class="truncate">' + esc(r.label) + "</span></span>" +
      '<span class="text-[#8d8b82] whitespace-nowrap">' + r.val + " 次 · " + pct + "%</span>" +
      "</div>"
    );
  }).join("");

  if (total === 0) {
    destroyChart("dist");
    emptyText.textContent = "暂无答题数据";
    empty.classList.remove("hidden");
    return;
  }
  empty.classList.add("hidden");

  if (typeof Chart === "undefined") {
    destroyChart("dist");
    document.getElementById("distCenterNum").textContent = "--";
    document.getElementById("distLegend").innerHTML = "";
    emptyText.textContent = "图表组件加载失败，请检查网络连接后刷新";
    empty.classList.remove("hidden");
    return;
  }

  destroyChart("dist");
  state.charts.dist = new Chart(canvas, {
    type: "doughnut",
    data: {
      labels: ["一次答对", "两次答对", "三次及以上答对"],
      datasets: [{
        data: [dist.first, dist.second, dist.thirdPlus],
        backgroundColor: ["#a8b5a0", "#c4a882", "#b98b8b"],
        borderColor: "#ffffff",
        borderWidth: 3,
        hoverOffset: 6,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: "62%",
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "rgba(74,72,69,0.92)",
          callbacks: {
            label: ctx => {
              const pct = total ? (ctx.parsed / total * 100).toFixed(1) : "0.0";
              return " " + ctx.label + "：" + ctx.parsed + " 次（" + pct + "%）";
            },
          },
        },
      },
    },
  });
}

function renderDistChartFallback() {
  destroyChart("dist");
  document.getElementById("distCenterNum").textContent = "--";
  document.getElementById("distLegend").innerHTML = "";
  document.getElementById("distChartEmptyText").textContent = "加载失败，请点击「刷新」重试";
  document.getElementById("distChartEmpty").classList.remove("hidden");
}

/* ---------- 学生表格 ---------- */

function accuracyColor(a) {
  if (a >= 80) return "#6f9a76";
  if (a >= 50) return "#b08a4d";
  return "#b06666";
}

function renderTable() {
  const rows = filterAndSort(state.students);
  const tbody = document.getElementById("studentTbody");
  const empty = document.getElementById("tableEmpty");
  const total = state.students.length;
  const kw = state.search.trim();

  document.getElementById("studentCount").textContent =
    kw ? "共 " + rows.length + " / " + total + " 人" : "共 " + total + " 人";

  if (!rows.length) {
    tbody.innerHTML = "";
    document.getElementById("tableEmptyText").textContent =
      total ? "没有匹配「" + kw + "」的学生" : "暂无学生答题数据";
    empty.classList.remove("hidden");
    return;
  }
  empty.classList.add("hidden");

  tbody.innerHTML = rows.map(s => {
    const acc = Number(s.accuracy || 0);
    return (
      '<tr class="hover:bg-[#faf7f3] transition">' +
      '<td class="px-5 py-3.5"><span class="flex items-center gap-2.5">' +
      '<span class="w-8 h-8 rounded-full bg-[#efe8df] text-[#8d8b82] flex items-center justify-center text-xs font-semibold shrink-0">' +
      esc(short(s.student_name, 1)) + "</span>" +
      '<span class="font-medium text-[#4a4845]">' + esc(s.student_name) + "</span></span></td>" +
      '<td class="px-5 py-3.5 text-[#6b6760]">' + Number(s.total_answers || 0) + "</td>" +
      '<td class="px-5 py-3.5 text-[#6b6760]">' + Number(s.correct_count || 0) + "</td>" +
      '<td class="px-5 py-3.5 font-semibold whitespace-nowrap" style="color:' + accuracyColor(acc) + '">' +
      acc.toFixed(1) + "%</td>" +
      '<td class="px-5 py-3.5 text-right">' +
      '<button onclick="openDetail(' + "'" + esc(s.student_name).replace(/'/g, "\\'") + "'" + ')" ' +
      'class="inline-flex items-center gap-1 bg-[#f3eee7] hover:bg-[#c4a882] hover:text-white text-[#6b6760] text-xs px-3 py-1.5 rounded-lg transition">' +
      "查看详情</button></td></tr>"
    );
  }).join("");
}

function renderTableFallback() {
  document.getElementById("studentTbody").innerHTML = "";
  document.getElementById("studentCount").textContent = "共 0 人";
  document.getElementById("tableEmptyText").textContent = "加载失败，请点击「刷新」重试";
  document.getElementById("tableEmpty").classList.remove("hidden");
}

function filterAndSort(list) {
  const kw = state.search.trim().toLowerCase();
  const filtered = kw
    ? list.filter(s => String(s.student_name || "").toLowerCase().includes(kw))
    : list.slice();
  const dir = state.sortDir === "asc" ? 1 : -1;
  filtered.sort((a, b) => {
    if (state.sortKey === "student_name") {
      return String(a.student_name || "").localeCompare(String(b.student_name || ""), "zh") * dir;
    }
    return (Number(a[state.sortKey] || 0) - Number(b[state.sortKey] || 0)) * dir;
  });
  return filtered;
}

function onSearch(value) {
  state.search = value || "";
  renderTable();
}

function handleSortClick(key) {
  if (state.sortKey === key) {
    state.sortDir = state.sortDir === "desc" ? "asc" : "desc";
  } else {
    state.sortKey = key;
    state.sortDir = key === "student_name" ? "asc" : "desc";
  }
  updateSortArrows();
  renderTable();
}

function updateSortArrows() {
  document.querySelectorAll("th[data-sort]").forEach(th => {
    const arrow = th.querySelector(".sort-arrow");
    arrow.textContent = th.dataset.sort === state.sortKey ? (state.sortDir === "asc" ? "▲" : "▼") : "⇅";
  });
}

/* ---------- 答题详情模态框 ---------- */

function openDetail(name) {
  const modal = document.getElementById("detailModal");
  const body = document.getElementById("modalBody");
  document.getElementById("modalTitle").textContent = name + " 的答题详情";
  modal.classList.remove("hidden");
  document.body.style.overflow = "hidden";
  body.innerHTML =
    '<div class="flex items-center justify-center gap-2 py-16 text-[#8d8b82] text-sm">' +
    '<div class="w-6 h-6 border-2 border-[#c4a882] border-t-transparent rounded-full animate-spin"></div>' +
    "正在加载答题明细…</div>";

  fetchJSON(API_BASE + "/api/answers/detail?student_name=" + encodeURIComponent(name))
    .then(rows => renderDetailBody(body, Array.isArray(rows) ? rows : []))
    .catch(err => {
      body.innerHTML =
        '<div class="py-12 text-center">' +
        '<p class="text-[#b06666] text-sm mb-3">⚠️ 加载明细失败：' + esc(friendlyMessage(err)) + "</p>" +
        '<button onclick="openDetail(' + "'" + esc(name).replace(/'/g, "\\'") + "'" + ')" ' +
        'class="bg-[#8d8b82] hover:bg-[#7c7a71] text-white text-sm px-4 py-2 rounded-xl transition">重试</button>' +
        "</div>";
    });
}

function renderDetailBody(body, rows) {
  if (!rows.length) {
    body.innerHTML = '<p class="py-14 text-center text-[#b5aca1] text-sm">该学生暂无答题记录</p>';
    return;
  }

  const correct = rows.filter(r => r.is_correct).length;
  const accuracy = rows.length ? (correct / rows.length * 100) : 0;
  const attemptCounts = {};
  rows.forEach(r => { attemptCounts[r.attempt_count] = (attemptCounts[r.attempt_count] || 0) + 1; });
  const attemptsSummary = Object.keys(attemptCounts).sort((a, b) => a - b)
    .map(k => "第 " + k + " 次：" + attemptCounts[k]).join(" · ");

  body.innerHTML =
    '<div class="flex flex-wrap gap-2 mb-4">' +
    chip("总答题", rows.length) +
    chip("答对", correct) +
    chip("正确率", accuracy.toFixed(1) + "%") +
    chip("作答分布", attemptsSummary || "--") +
    "</div>" +
    '<div class="overflow-x-auto rounded-xl border border-[#f0eae2]">' +
    '<table class="w-full text-xs sm:text-sm min-w-[720px]">' +
    "<thead>" +
    '<tr class="bg-[#f7f3ee] text-[#8d8b82] text-left">' +
    '<th class="px-3 py-2.5 font-medium">#</th>' +
    '<th class="px-3 py-2.5 font-medium">题号</th>' +
    '<th class="px-3 py-2.5 font-medium">题目</th>' +
    '<th class="px-3 py-2.5 font-medium">学生答案</th>' +
    '<th class="px-3 py-2.5 font-medium">正确答案</th>' +
    '<th class="px-3 py-2.5 font-medium">结果</th>' +
    '<th class="px-3 py-2.5 font-medium">作答次数</th>' +
    '<th class="px-3 py-2.5 font-medium">答题时间</th>' +
    "</tr></thead><tbody class='divide-y divide-[#f0eae2]'>" +
    rows.map((r, i) => {
      const ok = r.is_correct;
      return (
        "<tr class='hover:bg-[#faf7f3] transition'>" +
        '<td class="px-3 py-2.5 text-[#b5aca1]">' + (i + 1) + "</td>" +
        '<td class="px-3 py-2.5 text-[#6b6760]">第 ' + Number(r.question_index || 0) + " 题</td>" +
        '<td class="px-3 py-2.5 max-w-[180px] truncate text-[#4a4845]" title="' + esc(r.question_title || "") + '">' +
        esc(short(r.question_title, 18)) + "</td>" +
        '<td class="px-3 py-2.5 max-w-[150px] truncate text-[#6b6760]" title="' + esc(r.student_answer || "") + '">' +
        esc(short(r.student_answer, 13)) + "</td>" +
        '<td class="px-3 py-2.5 max-w-[150px] truncate text-[#6b6760]" title="' + esc(r.correct_answer || "") + '">' +
        esc(short(r.correct_answer, 13)) + "</td>" +
        '<td class="px-3 py-2.5">' +
        (ok
          ? '<span class="inline-flex items-center gap-1 bg-[#e8efe6] text-[#6f9a76] px-2 py-0.5 rounded-full text-xs font-medium">✅ 正确</span>'
          : '<span class="inline-flex items-center gap-1 bg-[#f6e3e0] text-[#b06666] px-2 py-0.5 rounded-full text-xs font-medium">❌ 错误</span>') +
        "</td>" +
        '<td class="px-3 py-2.5 text-[#8d8b82] whitespace-nowrap">第 ' + Number(r.attempt_count || 1) + " 次</td>" +
        '<td class="px-3 py-2.5 text-[#8d8b82] whitespace-nowrap">' + esc(r.created_at || "") + "</td>" +
        "</tr>"
      );
    }).join("") +
    "</tbody></table></div>";
}

function chip(label, value) {
  return (
    '<span class="inline-flex items-baseline gap-1.5 bg-[#f7f3ee] rounded-full px-3 py-1.5 text-xs text-[#8d8b82]">' +
    '<span class="text-[#4a4845] font-semibold">' + esc(String(value)) + "</span>" + esc(label) +
    "</span>"
  );
}

function closeModal() {
  document.getElementById("detailModal").classList.add("hidden");
  document.body.style.overflow = "";
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

/* ---------- 名单管理 ---------- */

function toggleAdminPanel() {
  const panel = document.getElementById("adminPanel");
  if (panel) panel.classList.toggle("hidden");
}

function adminHint(msg, ok) {
  const hint = document.getElementById("adminHint");
  if (!hint) return;
  hint.textContent = msg || "";
  hint.style.color = ok ? "#6f9a76" : (msg ? "#b06666" : "");
}

function showAdminResult(html) {
  const box = document.getElementById("adminResult");
  if (!box) return;
  box.innerHTML = html;
  box.classList.remove("hidden");
}

async function uploadRoster() {
  const key = (document.getElementById("adminKeyInput").value || "").trim();
  const text = (document.getElementById("rosterText").value || "").trim();
  if (!key) { adminHint("请输入管理口令"); return; }
  if (!text) { adminHint("请粘贴学生名单（每行一个姓名）"); return; }
  adminHint("上传中…");
  try {
    const res = await fetch(API_BASE + "/api/admin/students", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ admin_key: key, text })
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      adminHint("名单已更新", true);
      showAdminResult(
        "新增（默认密码 88888888）：" + (data.created.length ? data.created.join("、") : "无") +
        "\n重新加入（密码重置）：" + (data.reactivated.length ? data.reactivated.join("、") : "无") +
        "\n保留原密码：" + (data.kept.length ? data.kept.join("、") : "无") +
        "\n已停用：" + (data.deactivated.length ? data.deactivated.join("、") : "无") +
        "\n当前名单人数：" + data.active_count
      );
    } else {
      adminHint(data.detail || ("上传失败（" + res.status + "）"));
    }
  } catch (e) {
    adminHint("无法连接服务器，请确认后端已启动");
    console.warn("名单上传失败:", e);
  }
}

async function viewRoster() {
  const key = (document.getElementById("adminKeyInput").value || "").trim();
  if (!key) { adminHint("请输入管理口令"); return; }
  adminHint("查询中…");
  try {
    const res = await fetch(API_BASE + "/api/admin/students?admin_key=" + encodeURIComponent(key));
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      adminHint("查询完成", true);
      const rows = data.students || [];
      showAdminResult("当前名单（共 " + rows.length + " 人）：\n" +
        rows.map(s => (s.is_active ? "启用 " : "停用 ") + s.name).join("\n"));
    } else {
      adminHint(data.detail || ("查询失败（" + res.status + "）"));
    }
  } catch (e) {
    adminHint("无法连接服务器，请确认后端已启动");
    console.warn("名单查询失败:", e);
  }
}

document.getElementById("adminToggleBtn").addEventListener("click", toggleAdminPanel);
document.getElementById("uploadRosterBtn").addEventListener("click", uploadRoster);
document.getElementById("viewRosterBtn").addEventListener("click", viewRoster);

/* ---------- 启动 ---------- */

updateSortArrows();
loadAllData(false);
setInterval(() => {
  if (!document.hidden) loadAllData(false);
}, REFRESH_MS);
</script>
</body>
