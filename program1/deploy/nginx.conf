# 使用步骤：
# 1. 把两处 your-domain.com 换成你的真实域名
# 2. 复制到 /etc/nginx/sites-available/interactive-classroom
# 3. ln -s 到 sites-enabled 后执行 nginx -t && systemctl reload nginx
# 4. 用 certbot --nginx -d 你的域名 自动补全证书（见 DEPLOY.md）

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    # Nginx >= 1.25 可改用：listen 443 ssl; 并另起一行 http2 on;
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
